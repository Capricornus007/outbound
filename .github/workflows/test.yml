name: Go unit and race tests

on:
  push:
  pull_request:

permissions: read-all

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      # 原本那步 Go 安裝順帶開了 module 快取；composite 不管快取 → 顯式補一步。
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Zero-test debt ledger
        run: bash scripts/check-test-coverage.sh
      - name: Unit tests
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      # 原本那步 Go 安裝順帶開了 module 快取；composite 不管快取 → 顯式補一步。
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      - run: go test -race ./...
